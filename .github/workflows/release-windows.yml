name: Build, test and publish MININEC Windows x64
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/release-windows.yml'
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'requirements-build.txt'
permissions:
  contents: write
concurrency:
  group: mininec-windows-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned build requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Build self-contained console EXE
        shell: pwsh
        run: |
          python -m PyInstaller --clean --onefile --console --name mininec --hidden-import scipy._external.array_api_compat.numpy.fft src/mininec_cli.py
          if (!(Test-Path dist/mininec.exe)) { throw 'Missing mininec.exe' }
      - name: Test real dipole simulation and CLI
        shell: pwsh
        run: python tests/smoke.py dist/mininec.exe
      - name: Test postprocessor on free-space and real-ground dipoles
        shell: pwsh
        run: python tests/validate_postprocess.py dist/mininec.exe
      - name: Test 50-point single-process frequency sweep on packaged executable
        shell: pwsh
        run: python tests/test_sweep_exe.py dist/mininec.exe
      - name: Package and hash verified executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/mininec.exe release/mininec.exe
          Copy-Item LICENSE release/LICENSE
          Copy-Item THIRD_PARTY_NOTICES.md release/THIRD_PARTY_NOTICES.md
          Copy-Item -Recurse examples release/examples
          @'
          MININEC Windows x64 (unofficial PyMININEC distribution).
          Use from PowerShell: .\mininec.exe --help
          Example: .\mininec.exe --input examples/dipole_free.txt
          Upstream engine: https://github.com/schlatterbeck/pymininec
          Repository and model limitations: https://github.com/sergiozxp/mininec-windows
          This executable was tested with a real dipole simulation in GitHub Actions.
          '@ | Set-Content release/INSTALL.txt
          Compress-Archive -Path release/* -DestinationPath mininec-windows-x64.zip -Force
          Copy-Item dist/mininec.exe mininec.exe
          $exeHash=(Get-FileHash mininec.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash=(Get-FileHash mininec-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$exeHash  mininec.exe" | Set-Content -Encoding ascii SHA256SUMS.txt
          "$zipHash  mininec-windows-x64.zip" | Add-Content -Encoding ascii SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mininec-windows-release
          path: |
            mininec-windows-x64.zip
            mininec.exe
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish public GitHub Release (only after tests)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v1.2.0-windows'
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to replace public binary." }
          gh release create $tag mininec-windows-x64.zip mininec.exe SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "MININEC Windows x64 v1.2.0" --notes "Unofficial PyMININEC Windows x64 executable. Adds single-process frequency sweep from --input TXT with parameters.csv and optional per-frequency/total timings.csv. Original PyMININEC algorithms are unchanged. Includes examples, licenses and SHA-256 for EXE and ZIP."

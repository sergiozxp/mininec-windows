name: Build MININEC for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PyMININEC and PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --console --collect-all scipy --collect-all numpy --name mininec src/mininec_cli.py
      - name: Smoke test
        shell: pwsh
        run: |
          python tests/smoke.py dist/mininec.exe
      - name: Package attribution and executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/mininec.exe package/
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md package/
          Compress-Archive -Path package/* -DestinationPath mininec-windows-win64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: mininec-windows-win64
          path: mininec-windows-win64.zip
          if-no-files-found: error
      - name: Publish release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" mininec-windows-win64.zip --generate-notes
